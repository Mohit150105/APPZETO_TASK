version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: saas_mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - saas_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/saas_collab
      - JWT_SECRET=production_docker_secret_key_change_me_12345
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
      - MAX_FILE_SIZE_MB=5
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - saas_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - saas_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  saas_network:
    driver: bridge
